# The Go and npm dependencies get only the security updates (enabled in the
# repository settings); the GitHub Actions (pinned by commit SHA) and the
# Dockerfile base images (pinned by digest) are kept up to date monthly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - '*'
    commit-message:
      prefix: docker
