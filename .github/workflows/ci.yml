name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Lint
        run: golangci-lint run -c ./golangci.yml ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '>=25.2.1'

      - name: Build admin dashboard UI
        run: npm --prefix=./ui ci && npm --prefix=./ui run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      # structtag is disabled because tools/router/unmarshal_request_data_test.go
      # tests on purpose an unexported field with a json tag (upstream marks it //nolint:all)
      - name: Build and vet
        run: go build ./... && go vet -structtag=false ./...

      - name: Build the popgres binary
        run: go build -o popgres ./examples/base && ./popgres --help

      - name: No SQLite only SQL
        run: ./scripts/check-sql-patterns.sh

      # the SQLite importer (cmd/popgres-import) is the only package allowed to depend on SQLite
      - name: No SQLite dependency outside the importer
        run: |
          if go list -deps -test $(go list ./... | grep -v '/cmd/popgres-import') | grep -E 'modernc.org/sqlite|mattn/go-sqlite3'; then
            echo "only cmd/popgres-import can depend on a SQLite driver"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    env:
      # throwaway credentials of the CI container only
      PGPASSWORD: ci-superuser
      APP_PASSWORD: ci-popgres-app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      # GitHub Actions services can't pass -c flags to postgres, so the
      # container is started manually with the same settings as docker-compose.dev.yml
      - name: Start Postgres ${{ matrix.postgres }}
        run: |
          docker run -d --name popgres_ci -p 5432:5432 \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}-trixie \
            postgres -c wal_level=logical -c max_replication_slots=10 \
            -c max_wal_senders=10 -c max_slot_wal_keep_size=1GB
          # check over TCP: the temporary server started by the image entrypoint
          # during the first initialization listens only on the unix socket
          for i in $(seq 1 90); do
            docker exec popgres_ci pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec popgres_ci pg_isready -h 127.0.0.1 -U postgres

      # pg_dump/pg_restore for the backups (same or newer major version than the server)
      - name: Install the Postgres client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version

      - name: Prepare the test databases
        run: |
          docker cp scripts/ci-db-setup.sql popgres_ci:/tmp/ci-db-setup.sql
          docker exec popgres_ci psql -U postgres -v ON_ERROR_STOP=1 \
            -v app_password="$APP_PASSWORD" -f /tmp/ci-db-setup.sql
          docker exec popgres_ci psql -U postgres -d popgres_test -Atc \
            "select version(), current_setting('wal_level'), (select string_agg(extname, ',') from pg_extension)"

      # Acceptance tests of the current phase against POPGRES_TEST_URL with the
      # non-superuser role popgres_app (the whole suite runs once it passes on Postgres).
      - name: Test
        env:
          POPGRES_TEST_URL: postgres://popgres_app:${{ env.APP_PASSWORD }}@localhost:5432/popgres_test?sslmode=disable
        run: make test-accept

      - name: Leftover test databases
        if: always()
        run: |
          docker exec popgres_ci psql -U postgres -Atc "select datname from pg_database where starts_with(datname, 'popgres_t_') or starts_with(datname, 'popgres_fx_')"

      - name: The main binary doesn't link SQLite
        run: |
          if go list -deps ./examples/base | grep -E 'modernc.org/sqlite|mattn/go-sqlite3'; then
            echo "the popgres binary must not depend on a SQLite driver"
            exit 1
          fi
