name: release

# Publishes a GitHub release with the popgres and popgres-import archives
# when a version tag (eg. v1.0.0) is pushed. The tests run in the ci workflow:
# tag only a commit with a green ci run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      # a manual run (not a tag) builds a snapshot only
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      # the admin UI (ui/dist) is built and committed with the sources
      - name: Build and vet
        run: go build ./... && go vet -structtag=false ./...

      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "flags=${flags} --release-notes=$notes" >> $GITHUB_ENV
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.12.7'
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
