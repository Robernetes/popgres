version: 2

project_name: popgres

dist: .builds

before:
  hooks:
    - go mod tidy

builds:
  - id: build_noncgo
    main: ./examples/base
    binary: popgres
    ldflags:
      - -s -w -X github.com/Robernetes/popgres.Version={{ .Version }} -X github.com/Robernetes/popgres/apis.MCPVersion={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

  # the PocketBase importer (the only binary that links a SQLite driver)
  - id: build_import
    main: ./cmd/popgres-import
    binary: popgres-import
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

release:
  name_template: 'popgres {{ .Tag }}'
  draft: false

archives:
  - id: archive_noncgo
    ids: [build_noncgo]
    formats: [zip]
    files:
      - LICENSE.md
      - CHANGELOG.md

  - id: archive_import
    ids: [build_import]
    name_template: 'popgres-import_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [zip]
    files:
      - LICENSE.md

checksum:
  name_template: 'checksums.txt'

# an SPDX SBOM of each archive (requires syft)
sboms:
  - artifacts: archive

# a Sigstore bundle of the checksums file (requires cosign and the GitHub OIDC token), verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/Robernetes/popgres/\.github/workflows/release\.yaml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args: ['sign-blob', '--bundle=${signature}', '${artifact}', '--yes']

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^examples:'
      - '^ui:'
