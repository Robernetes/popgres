# Round-robin load balancer of the popgres cluster demo (docker-compose.cluster.yml).
# There are no sticky sessions: any node can serve any request.

upstream popgres {
    server node1:8090;
    server node2:8090;
    server node3:8090;
}

server {
    listen 80;

    client_max_body_size 50m;

    location / {
        proxy_pass http://popgres;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # realtime (SSE) connections
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
